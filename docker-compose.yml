services:
  excalidraw:
    build:
      context: .
      args:
        NODE_ENV: production
    container_name: excalidraw
    ports:
      - "127.0.0.1:5002:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      workspace:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  workspace:
    build:
      context: ./workspace-server
    container_name: excalidraw-workspace
    expose:
      - "3001"
    volumes:
      - workspace-data:/data
    restart: unless-stopped

volumes:
  workspace-data:
